<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Register</title></head>
<body>
  <h1>Register</h1>
  <form>
    <label>Username <input name="username"></label>
    <label>Email <input name="email"></label>
    <label>Password <input name="password"></label>
    <label>Confirm password <input name="confirmation"></label>
    <label><input type="checkbox"> Accept terms</label>
    <button>Register</button>
  </form>
  <script>document.querySelector('form').addEventListener('submit', event => event.preventDefault());</script>
</body>
</html>
